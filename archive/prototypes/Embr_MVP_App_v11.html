<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --backdrop:#ecedee; --backdrop2:#f5f5f6; --ink:#000000; --graphite:#5e6168; --mist:#6e7178; --line:#dcdde0; --line2:#c4c6ca;
  --embr:#ff3b00;--embr-text:#c42d00; --embr-press:#d93200; --embr-tint:#fff1ec;
  --ok:#0f7b3f; --warn:#a15c00; --bad:#c0281b;
  --r:4px;
  --wide:"wdth" 125; --cond:"wdth" 82;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--embr);outline-offset:2px}
img{display:block;max-width:100%}

/* type */
.display{font-variation-settings:var(--wide);font-weight:800;letter-spacing:-.025em;line-height:.95}
.t-72{font-size:clamp(44px,7vw,76px)} .t-48{font-size:clamp(34px,5vw,48px)} .t-32{font-size:32px} .t-24{font-size:24px} .t-18{font-size:18px}
h1,h2,h3,h4{font-weight:700;line-height:1.2}
h2.sec{font-size:18px;font-weight:700;margin-bottom:12px}
h3{font-size:15px}
.g{color:var(--graphite)} .m{color:var(--mist)} .s{font-size:13px} .xs{font-size:12px}
.wide{font-variation-settings:var(--wide)}
.num{font-variant-numeric:tabular-nums lining-nums}
.money{font-weight:700;font-variant-numeric:tabular-nums}
p+p{margin-top:8px}
.measure{max-width:62ch}

/* layout */
.shell{max-width:1280px;margin:0 auto;padding:0 32px}
header.top{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20}
.topbar{display:flex;align-items:center;gap:36px;height:64px}
.brandmark img{height:24px}
nav.main{display:flex;gap:26px;height:100%}
nav.main button{height:100%;font-size:14px;font-weight:500;color:var(--graphite);border-bottom:2px solid transparent;position:relative;padding-top:2px}
nav.main button:hover{color:var(--ink)}
nav.main button[aria-current]{color:var(--ink);border-bottom-color:var(--ink)}
.flag{display:inline-block;width:6px;height:6px;background:var(--embr);border-radius:50%;vertical-align:top;margin-left:3px}
.who{margin-left:auto;display:flex;align-items:center;gap:18px}
.viewas{font-size:13px;color:var(--graphite);display:flex;gap:2px;align-items:center}
.viewas button{padding:5px 9px;border-radius:var(--r);font-weight:600;color:var(--graphite)}
.viewas button[aria-pressed=true]{background:var(--ink);color:#fff}
.bell{position:relative;width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r)}
.bell:hover{background:var(--backdrop2)}
.bell .ct{position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--embr);color:#000;font-size:10px;font-weight:700;display:grid;place-items:center}
main.shell{padding-top:44px;padding-bottom:120px}
.row{display:flex;align-items:center;gap:12px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.top-al{align-items:flex-start}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:48px;align-items:start}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}.mt48{margin-top:48px}
.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
.mb12{margin-bottom:12px}
.mb48{margin-bottom:48px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:var(--r);border:1px solid var(--ink);background:var(--paper);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--backdrop2)}
.btn.primary{background:var(--embr);border-color:var(--embr);color:#000}
.btn.primary:hover{background:#000;border-color:#000;color:#fff}
.btn.ink{background:var(--ink);color:#fff}
.btn.ink:hover{background:#222}
.btn.quiet{border-color:transparent;padding:0 10px;color:var(--graphite)}
.btn.quiet:hover{color:var(--ink);background:var(--backdrop2)}
.btn.danger{border-color:var(--line2);color:var(--bad)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2);font-weight:500}
.link:hover{text-decoration-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.field .hint{font-weight:400;color:var(--graphite);font-size:12px}
.in{width:100%;height:42px;padding:0 12px;border:1px solid var(--line2);border-radius:var(--r);background:var(--paper);font-size:15px;font-weight:400}
textarea.in{height:auto;min-height:88px;padding:10px 12px;resize:vertical;line-height:1.45}
.in:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fgrid .span{grid-column:1/-1}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:1px;accent-color:var(--ink)}

/* status */
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;white-space:nowrap}
.st:before{content:"";width:8px;height:8px;background:currentColor;border-radius:1px}
.st.act{color:var(--embr-text)} .st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)} .st.off{color:var(--mist)}
.st.wait{color:var(--graphite)}
.verified{display:inline-block;width:14px;height:14px;vertical-align:-1px;margin-left:5px}

/* board */
.sentence{font-size:clamp(18px,2.2vw,22px);line-height:1.9;color:var(--graphite);max-width:900px}
.sentence select,.sentence input{border:0;border-bottom:2px solid var(--ink);background:transparent;font-weight:700;color:var(--ink);padding:0 2px;border-radius:0;font-size:inherit;appearance:none;-webkit-appearance:none;cursor:pointer}
.sentence select{padding-right:4px}
.sentence input[type=number]{width:3em}
.sentence input[type=date]{font-size:.8em}
.sentence select:focus,.sentence input:focus{outline:none;border-bottom-color:var(--embr)}
.toolbar{display:flex;gap:16px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin:28px 0 28px}
.search{display:flex;align-items:center;gap:8px;flex:1;max-width:380px}
.search input{border:0;height:32px;width:100%;font-size:15px;background:transparent}
.search input:focus{outline:none}
.comps{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:40px 24px}
.comp{text-align:left;display:block;width:100%}
.comp .shot{aspect-ratio:4/5;background:var(--backdrop) center/cover no-repeat;position:relative;overflow:hidden}
.comp .shot .tname{position:absolute;left:16px;right:16px;bottom:14px;font-variation-settings:var(--wide);font-weight:800;font-size:clamp(28px,2.6vw,36px);line-height:.9;letter-spacing:-.03em;color:var(--ink);text-align:left}
.comp .shot .cat{position:absolute;left:16px;top:14px;font-size:12px;font-weight:600;color:var(--graphite)}
.comp .save{position:absolute;top:10px;right:10px;width:34px;height:34px;display:grid;place-items:center;background:var(--paper);border-radius:50%}
.comp .save svg{width:16px;height:16px}
.comp .save[aria-pressed=true] svg{fill:var(--embr);stroke:var(--embr)}
.comp .nm{font-variation-settings:var(--wide);font-weight:700;font-size:17px;letter-spacing:-.01em;margin-top:12px;display:flex;align-items:center}
.comp .meas{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:4px 22px;margin-top:6px;font-size:13px}
.comp .meas dt{color:var(--mist);font-size:12px}
.comp .meas dd{font-weight:600}
.comp:hover .nm{text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 13px;border:1px solid var(--line2);border-radius:16px;font-size:13px;font-weight:600;color:var(--graphite)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* lists */
.list{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
button.item:hover .ttl{text-decoration:underline;text-underline-offset:3px}
.item .ttl{font-weight:700}
.item .meta{font-size:13px;color:var(--graphite);display:flex;gap:14px;flex-wrap:wrap;margin-top:2px}
.item .amt{text-align:right;white-space:nowrap}
.thumb{width:48px;height:60px;background:var(--backdrop) center/cover;flex-shrink:0;display:grid;place-items:center;font-variation-settings:var(--wide);font-weight:800;font-size:15px;color:var(--graphite)}
.thumb.sq{width:44px;height:44px;border-radius:var(--r)}
.logo-sq{width:44px;height:44px;border-radius:var(--r);background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex-shrink:0;font-variation-settings:var(--wide)}
.todo{background:var(--embr-tint);border-radius:var(--r);padding:4px 20px;margin-bottom:40px}
.todo .item{border-color:rgba(255,59,0,.18)}
.todo .item:last-child{border-bottom:0}
.empty{padding:40px 0;color:var(--graphite)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-top:1px solid var(--ink)}
.fig{padding:16px 20px 20px 0}
.fig+.fig{padding-left:20px;border-left:1px solid var(--line)}
.fig .v{font-variation-settings:var(--wide);font-weight:800;font-size:clamp(24px,2.6vw,32px);letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.fig .l{font-size:13px;color:var(--graphite);font-weight:500}
.fig .n{font-size:12px;color:var(--graphite);margin-top:4px}
.panel{border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel.tint{background:var(--backdrop2);border-color:transparent}
.bar{height:6px;background:var(--backdrop);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.bars .b{display:grid;grid-template-columns:150px 1fr 70px;gap:14px;align-items:center;font-size:13px;padding:6px 0}
.bars .b span:last-child{text-align:right;font-weight:700}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tabs button{padding:10px 0;font-weight:600;font-size:14px;color:var(--graphite);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.tabs .c{color:var(--mist);font-weight:500;margin-left:4px}

/* job card */
.job{display:grid;grid-template-columns:1fr auto;gap:6px 24px;padding:20px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.job:hover .ttl{text-decoration:underline;text-underline-offset:3px}
.job .ttl{font-variation-settings:var(--wide);font-weight:700;font-size:18px;letter-spacing:-.01em}
.job .rate{text-align:right;font-variation-settings:var(--wide);font-weight:800;font-size:20px}
.job .facts{grid-column:1/-1;display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--graphite)}
.job .facts b{color:var(--ink);font-weight:600}
.tag-f{font-size:12px;font-weight:700;color:var(--embr-text);margin-left:10px;font-variation-settings:normal;letter-spacing:0}

/* sheet & dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;animation:fade .18s ease-out}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(880px,100%);background:var(--paper);z-index:41;display:flex;flex-direction:column;animation:slide .26s cubic-bezier(.2,.8,.2,1);box-shadow:-24px 0 60px rgba(0,0,0,.12)}
.sheet .hd{display:flex;align-items:center;gap:16px;padding:18px 32px;border-bottom:1px solid var(--line)}
.sheet .bd{flex:1;overflow-y:auto;padding:32px}
.sheet .ft{padding:16px 32px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--paper)}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 48px);overflow-y:auto;background:var(--paper);z-index:43;border-radius:6px;animation:pop .2s ease-out;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.dialog.lg{width:min(820px,calc(100% - 32px))}
.dialog .hd{padding:22px 28px 0;display:flex;align-items:flex-start;gap:12px}
.dialog .bd{padding:18px 28px 24px}
.dialog .ft{padding:16px 28px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.scrim.over{z-index:42}
.xbtn{margin-left:auto;width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r);flex-shrink:0}
.xbtn:hover{background:var(--backdrop2)}
@keyframes fade{from{opacity:0}} @keyframes slide{from{transform:translateX(40px);opacity:.4}} @keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* call sheet */
.cs-head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-bottom:24px;border-bottom:1px solid var(--ink)}
.cs-date{text-align:right}
.cs-date .d{font-variation-settings:var(--wide);font-weight:800;font-size:44px;line-height:.9;letter-spacing:-.03em}
.cs-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;margin-top:28px}
.cs-sec{padding:20px 0;border-bottom:1px solid var(--line)}
.cs-sec:first-child{padding-top:0}
.cs-sec h4{font-size:13px;font-weight:700;margin-bottom:10px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--graphite)}
.people{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.person{display:flex;gap:12px;align-items:center}
table.use{width:100%;border-collapse:collapse;font-size:14px}
table.use th{text-align:left;font-size:12px;font-weight:600;color:var(--graphite);padding:0 8px 8px 0;border-bottom:1px solid var(--line)}
table.use td{padding:10px 8px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.use td:last-child,table.use th:last-child{text-align:right;padding-right:0}
.ledger .r{display:flex;justify-content:space-between;gap:16px;padding:6px 0;font-size:14px}
.ledger .r.t{border-top:1px solid var(--ink);margin-top:6px;padding-top:10px;font-weight:700}
.ledger .r.sub{color:var(--graphite);font-size:13px}
.ledger .r .when{color:var(--graphite);font-size:12px;display:block;font-weight:400}
.sched{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;font-size:14px;align-items:baseline}
.sched .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line2);margin-top:5px}
.sched .dot.done{background:var(--ink);border-color:var(--ink)}
.sched .dot.now{border-color:var(--embr);background:var(--embr)}
.sched .lbl{font-weight:600}
.sched .sub{grid-column:2/4;color:var(--graphite);font-size:12px;margin-bottom:10px}
.log{font-size:13px}
.log div{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.log span:first-child{color:var(--mist)}
.thread{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto;padding:4px 2px 12px}
.bubble{max-width:88%;font-size:14px;padding:9px 12px;border-radius:12px;background:var(--backdrop2);line-height:1.4}
.bubble.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:3px}
.bubble.them{align-self:flex-start;border-bottom-left-radius:3px}
.bubble .w{font-size:11px;opacity:.6;margin-top:3px}
.note{font-size:13px;color:var(--graphite);border-left:2px solid var(--line2);padding:2px 0 2px 12px}
.note.act{border-color:var(--embr);color:var(--ink)}
.callout{background:var(--backdrop2);border-radius:var(--r);padding:14px 16px;font-size:14px}
.callout.act{background:var(--embr-tint)}
.callout.bad{background:#fdecea}

/* talent profile sheet */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.gallery div{aspect-ratio:4/5;background:var(--backdrop) center/cover}
.gallery div:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
.pname{font-variation-settings:var(--wide);font-weight:800;font-size:clamp(36px,5vw,56px);line-height:.92;letter-spacing:-.03em}
.statline{display:flex;flex-wrap:wrap;gap:12px 36px;margin-top:20px}
.statline dt{font-size:12px;color:var(--mist)} .statline dd{font-weight:700;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;max-width:340px;width:100%}
.cal .d{aspect-ratio:1;display:grid;place-items:center;font-size:12px;font-weight:600;border-radius:2px;background:var(--backdrop2)}
.cal .d.free{background:var(--backdrop2)}
.cal .d.off{background:transparent;color:var(--mist);text-decoration:line-through;box-shadow:inset 0 0 0 1px var(--line)}
.cal .d.bkd{background:var(--ink);color:#fff}
.cal .d.opt,.optsw{background:repeating-linear-gradient(135deg,var(--backdrop2) 0 3px,#c9ccd1 3px 6px)}
.svgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:40px 24px}
.svc .shot{aspect-ratio:4/5;background:var(--backdrop) center/cover no-repeat;position:relative}
.svc .shot .tname{position:absolute;left:16px;bottom:14px;font-variation-settings:var(--wide);font-weight:800;font-size:30px;line-height:.9}
.svc .nm{font-weight:700}
.seg{display:flex;border:1px solid var(--line2)}
.seg button{flex:1;height:38px;font-weight:600;font-size:14px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.rg{display:block}
.rg-w{color:var(--warn)}
.cal .d.hd{background:none;color:var(--mist);font-weight:500;aspect-ratio:auto;padding-bottom:4px}
.cal.edit .d.free,.cal.edit .d.off{cursor:pointer}
.cal.edit .d.free:hover,.cal.edit .d.off:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--graphite);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:1px}
.phs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.phs .p{aspect-ratio:4/5;background:var(--backdrop) center/cover;position:relative}
.phs .p button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--paper);font-size:15px;line-height:1}
.phs label.p{display:grid;place-items:center;border:1.5px dashed var(--line2);background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--graphite);text-align:center}
.phs label.p:hover{border-color:var(--ink);color:var(--ink)}

/* usage builder */
.uline{display:grid;grid-template-columns:1fr 1fr 1fr 32px;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.uline [data-k=media]{grid-column:1/3}.uline [data-k=term]{grid-column:3}.uline .rm{grid-column:4;grid-row:1}
.uline [data-k=territory]{grid-column:1;grid-row:2}.uline .feewrap{grid-column:2;grid-row:2}.uline .check{grid-column:3/5;grid-row:2}
.feewrap{white-space:nowrap;display:flex;align-items:center;border:1px solid var(--line2);border-radius:var(--r);padding-left:10px;font-size:14px;color:var(--graphite)}
.feewrap:focus-within{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.feewrap .in{border:0;box-shadow:none!important;padding-left:6px}
.uline .in{height:38px;font-size:14px;padding:0 8px}
.adv-only{display:none}form:has(details.more[open]) .adv-only{display:revert}
.uline .feewrap{grid-column:1;grid-row:2}.uline .check{grid-column:2/5;grid-row:2}
form:has(details.more[open]) .uline .feewrap{grid-column:2}form:has(details.more[open]) .uline .check{grid-column:3/5}

<script>
/* =================================================================
   Embr — marketplace prototype (v2)
   Data is stored in this browser only. Payments, identity checks and
   payouts are simulated; see "How this prototype works" for the
   production integrations each step stands in for.
   ================================================================= */
const KEY='embr_v10';
const FEE=0.10, DEPOSIT=0.5, SUB=[10,18];
const TIER_LABELS=['First booking','Repeat rate','Regular rate'];
const CFG0=()=>({tiers:[[0,10],[1,7],[4,5]],direct:5,deposit:50,trustedAfter:5,buyoutPct:10,buyoutMin:250,noncirc:12,autoH:72});
const C=()=>S.cfg||(S.cfg=CFG0());
const tiers=()=>C().tiers.map(([n,r],i)=>[n,r/100,TIER_LABELS[i]]);
function tierText(){const t=C().tiers;const ord=n=>['first','second','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth'][n]||((n+1)+'th');return t[0][1]+'% first time, '+t[1][1]+'% from the '+ord(t[1][0])+' booking, '+t[2][1]+'% from the '+ord(t[2][0]);}
function brandDone(brandId){return S.bookings.filter(x=>x.brandId===brandId&&x.status==='completed').length;}
function isTrusted(brandId){return brandDone(brandId)>=C().trustedAfter;}
function depositFor(brandId){return C().deposit/100;}

  const last=ks.map(b=>b.completedAt||0).sort((a,c)=>c-a)[0]||0;const until=last?last+C().noncirc*30.4*864e5:0;
  const spent=ks.flatMap(b=>b.payouts).filter(p=>p.t>=since&&!/Travel/.test(p.label)).reduce((s2,p)=>s2+p.amount,0);
  return {spent:r2(spent),fee:Math.max(C().buyoutMin,r2(spent*C().buyoutPct/100)),until,free:!until||until<Date.now()};}

const pct=r=>(Math.round(r*1000)/10)+'%';

function rebookedBy(t){const m={};S.bookings.filter(b=>b.talentId===t.id&&b.status==='completed').forEach(b=>m[b.brandId]=(m[b.brandId]||0)+1);return Object.values(m).filter(n=>n>=2).length;}

/* ---------- status vocabulary ---------- */
function status(b,r=R()){
  const cut=pendingCut(b);
  switch(b.status){
    case 'offer':return r==='talent'?['New offer','act']:['Offer sent','wait'];
    case 'accepted':return r==='brand'?['Accepted, deposit due','act']:['Accepted, awaiting deposit','wait'];
    case 'confirmed':return b.wrapped?(r==='brand'?['Wrapped, sign off','act']:['Wrapped, awaiting sign-off','wait']):['Confirmed','ok'];
    case 'completed':
      if(b.issue&&b.issue.kind==='usage'&&!b.issue.closed)return ['Usage claim open','bad'];
      if(b.travel&&b.travel.claimStatus==='submitted')return r==='brand'?['Expenses to review','act']:['Expenses submitted','wait'];
      if(cut.length)return r==='brand'?['Final cut due '+dShort(cutDue(b)),'act']:['Paid, final cut pending','ok'];
      return ['Completed','off'];
    case 'issue':return ['Issue open','bad'];
    case 'declined':return ['Declined','off'];
    case 'withdrawn':return ['Withdrawn','off'];
    case 'cancelled':return ['Cancelled','off'];
    case 'refunded':return ['Refunded','off'];
  }
  return [b.status,'off'];
}

const RATE_BASE={'Model':[150,350],'Content creator':[120,300],'Photographer':[250,500],'Videographer':[250,550],'Make-up artist':[120,250],'Stylist':[150,300]};
function rateGuide(cat,city){
  const l=S.bookings.filter(b=>['completed','confirmed','accepted'].includes(b.status)&&T(b.talentId).cat===cat&&(!city||b.city===city)).map(b=>b.rate).sort((a,c)=>a-c);
  if(l.length>=4){const q=p=>l[Math.min(l.length-1,Math.round((l.length-1)*p))];return {lo:q(.1),hi:q(.9),n:l.length,src:'from '+l.length+' Embr bookings'};}
  const b=RATE_BASE[cat]||[250,550];const k=city&&city!=='London'?.85:1;const r=x=>Math.round(x*k/10)*10;
  return {lo:r(b[0]),hi:r(b[1]),n:l.length,src:'Embr starting guide'};}
function rgText(g,rate,who){const low=rate&&rate<g.lo*.9,high=rate&&rate>g.hi*1.25;
  return 'Typical: '+gbp(g.lo)+' to '+gbp(g.hi)+' a day <span class="g">('+g.src+')</span>'+(low?'<b class="rg-w"> '+(who==='brand'?'Below the usual range, so fewer people may accept.':'That\'s below the usual range. Don\'t undersell yourself.')+'</b>':high?'<span class="g"> Above the usual range.</span>':'');}
function rateNote(cat,city,rate,who){return '<span class="hint rg" data-cat="'+esc(cat)+'" data-city="'+esc(city||'')+'" data-who="'+(who||'talent')+'">'+rgText(rateGuide(cat,city),rate,who)+'</span>';}

const AUTO_H=()=>C().autoH||72;
const autoAt=b=>b.wrappedAt?b.wrappedAt+AUTO_H()*36e5:null;
function whenTxt(ts){const d=new Date(ts);return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+' at '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function doSignoff(b,meth,auto){const m=money(b),t=T(b.talentId),now=Date.now();
  b.charges.forEach(c=>c.held=false);b.charges.push({t:now,label:'Balance',amount:m.balance,method:meth});b.balanceMethod=meth;if(meth!=='card')b.due=meth==='monthly'?monthDue():addDays(meth==='terms60'?60:30);
  b.payouts.push({t:now,label:'Session'+(m.tday?', travel day':'')+(m.fit?', fitting':'')+(m.ot?', overtime':'')+(m.gUse?' and guaranteed usage':''),amount:m.earned});b.status='completed';b.completedAt=now;b.wrapped=true;
  log(b,(auto?'Signed off automatically, '+AUTO_H()+' hours after wrap with no problem reported. ':'Brand signed off. ')+'Balance '+(meth==='card'?'paid by card':meth==='monthly'?'added to the monthly invoice':'moved to '+(meth==='terms60'?60:30)+'-day terms'));log(b,'Paid to talent: '+gbp(m.earned));
  if(pendingCut(b).length)log(b,'Final cut due '+dMed(cutDue(b)));
  notify('talent','You\'ve been paid '+gbp(m.earned)+' for “'+b.title+'”'+(auto?'. It was signed off automatically.':'.'),b.id);
  if(auto)notify('brand','“'+b.title+'” was signed off automatically '+AUTO_H()+' hours after '+first(t.name)+' wrapped. The balance of '+gbp(m.balance)+' was '+(meth==='card'?'charged to your card':'added to your monthly invoice')+'.',b.id);
  return m;}
function runAuto(){let n=0;const now=Date.now();
  S.bookings.forEach(b=>{if(b.status==='confirmed'&&b.wrapped&&b.wrappedAt&&!(b.issue&&!b.issue.closed)&&now>=autoAt(b)){const br=BR(b.brandId);doSignoff(b,br.monthly&&isTrusted(br.id)?'monthly':'card',true);n++;}});
  (S.options||[]).forEach(o=>{if(optActive(o)&&o.expires<today()){o.state='expired';notify('brand','Your option on '+T(o.talentId).name+' for '+dMed(o.date)+' has lapsed.');promote(o);n++;}});
  if(n)save();return n;}
function autoNote(b){if(!(b.status==='confirmed'&&b.wrapped&&b.wrappedAt))return '';const at=autoAt(b),r=R(),br=BR(b.brandId),t=T(b.talentId);
  return '<div class="callout act mt24"><b>'+(r==='talent'?'You\'ll be paid by '+whenTxt(at)+' at the latest.':'Signs off automatically '+whenTxt(at)+'.')+'</b> '+(r==='talent'?'If '+esc(br.name)+' doesn\'t sign off or report a problem before then, Embr signs it off and pays you.':'If you don\'t sign off or report a problem before then, Embr signs it off and the balance of '+gbp(money(b).balance)+' is charged. '+esc(first(t.name))+' is paid straight away.')+'<div class="mt8"><button class="link xs" data-a="skipauto" data-id="'+b.id+'">Prototype: skip ahead '+AUTO_H()+' hours</button></div></div>';}

const TVM=['TV'],OOHM=['Posters and print'];
const liveLines=b=>b.usage.filter(u=>u.state!=='dropped'&&u.state!=='pending');
const needTV=b=>liveLines(b).some(u=>TVM.includes(u.media)),needOOH=b=>liveLines(b).some(u=>OOHM.includes(u.media));
const canTV=b=>needTV(b)||(b.rec&&b.rec.tv.length>0),canOOH=b=>needOOH(b)||(b.rec&&b.rec.ooh.length>0);
const recOf=b=>b.rec=b.rec||{tv:[],ooh:[]};
const CLOCK_RE=/^[A-Z]{3}\/[A-Z0-9]{1,12}\/\d{3,4}$/i;
function lineFor(b,media){return liveLines(b).find(u=>u.media===media)||liveLines(b).find(u=>u.media==='All of it');}
function hashN(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h;}
function simAirings(b,clock){const start=addDays(10+hashN(clock)%10,b.date);const end=today()<start?start:today();const days=Math.max(1,daysBetween(start,end));return {first:start,last:end,spots:Math.round(days*(3+hashN(clock)%5))};}
function recFinding(b,media,date,where,src){const u=lineFor(b,media);const until=u&&usageUntil(b,u);if(u&&until&&date>until){S.watch=S.watch||[];if(!S.watch.some(w=>w.bk===b.id&&w.src===src&&w.kind==='expired')){S.watch.unshift({id:uid('w'),bk:b.id,talentId:b.talentId,lineId:u.id,media:u.media,where,seen:date,kind:'expired',state:'new',src});notify('talent',media==='TV'?'Your TV ad from “'+b.title+'” has aired after the licence ended. Check usage watch.':'An outdoor campaign from “'+b.title+'” runs past the licence end date. Check usage watch.',b.id);notify('ops','Usage after licence on “'+b.title+'” ('+media+').',b.id);}return true;}return false;}
function recSec(b){if(!['confirmed','completed'].includes(b.status)||!(canTV(b)||canOOH(b)))return '';const r=recOf(b),isB=R()==='brand';
  let h='<section class="cs-sec"><h4>TV and posters</h4><p class="xs g mb12">If the images go on TV or posters, the brand adds the details here within 14 days of them going live, so Embr can check they run only as long as agreed.</p>';
  if(canTV(b)){const u=lineFor(b,'TV'),until=u&&usageUntil(b,u);

async function storyCard(t){const W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  try{await document.fonts.load('900 200px Archivo');}catch(e){}
  x.fillStyle='#f2f0eb';x.fillRect(0,0,W,H);
  const lines=posterLines(t),pad=64,target=W-pad*2;const fam="'Archivo', 'Arial Narrow', Arial, sans-serif";
  let fs=Math.min(420,Math.round(target/(Math.max(4,...lines.map(l=>l.length))*.5)));
  try{x.fontStretch='extra-condensed';}catch(e){}
  x.font='900 '+fs+'px '+fam;x.fillStyle='#000';x.textBaseline='alphabetic';
  let y=250;const lh=fs*.84;
  lines.forEach((l,i)=>{const w=x.measureText(l).width;const sx=Math.min(1,target/w);y+=i===0?fs*.78:lh;x.save();x.translate(pad,y);x.scale(sx,1);x.fillText(l,0,0);x.restore();});
  const src=photo(t.photos[0]);
  if(src){const img=await new Promise((res)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=src;});
    if(img){const top=lines.length>1?y-fs*.26:y-fs*.3,bx=190,bw=W-bx*2,bh=H-360-top;const r=Math.max(bw/img.width,bh/img.height);const sw=bw/r,sh=bh/r;
      x.drawImage(img,(img.width-sw)/2,Math.max(0,(img.height-sh)*.2),sw,sh,bx,top,bw,bh);}}
  x.font='600 30px '+fam;try{x.fontStretch='normal';x.letterSpacing='5px';}catch(e){}
  x.fillStyle='#000';x.textAlign='left';x.fillText(t.cat.toUpperCase(),pad,H-300);x.fillText(t.city.toUpperCase(),pad,H-258);
  x.textAlign='right';x.fillText(('From '+gbp(t.rate)+' / day').toUpperCase(),W-pad,H-300);x.fillText('BOOK ON EMBR',W-pad,H-258);
  const bw2=x.measureText('BOOK ON EMBR').width;x.fillStyle='#ff3b00';x.fillRect(W-pad-bw2-34,H-282,20,20);
  x.fillStyle='#000';x.textAlign='left';x.font='500 26px '+fam;x.fillText(bmUrl(t),pad,H-200);
  return c;}

<tr><td>Analytics</td><td>Only if you allow it in cookie settings (consent)</td></tr></tbody></table>
<h3 class="mt24">Who we share it with</h3><p>The other side of your booking (only what they need), our payments provider, our business pay-later partner, our ID-check provider, our email and text-message provider, our hosting provider, and professional advisers. [Named list to add before launch.] We don't sell your data.</p>
<h3 class="mt24">How long we keep it</h3><p>Booking, payment and invoice records: up to 6 years, for tax and accounting. Everything else: until you close your account, then deleted or anonymised. Help requests: [period to set].</p>
<h3 class="mt24">Your rights</h3><p>You can ask for a copy of your data, ask us to correct or delete it, object to some uses, and take it elsewhere. Use "Your data" in the app or email us. We reply within one month. You can complain to the Information Commissioner's Office (ico.org.uk).</p>
<h3 class="mt24">18+ only</h3><p>Embr isn't for under-18s. We don't knowingly collect data about children, and we delete it if we find we have.</p>`,
 cookies:()=>`<h3>What Embr stores</h3><p><b>Essential:</b> browser storage that keeps you signed in and remembers your work in the app. The app can't run without it, so it doesn't need your consent.</p><p class="mt12"><b>Analytics (optional):</b> measuring how the app is used, to improve it. Off unless you allow it. This prototype doesn't run any analytics.</p>

<h3 class="mt24">Pay-later terms</h3><p>If you pay the balance on 30 or 60-day terms, any partner fee is shown before you choose it. [Partner fees to add.]</p>`,
 reviews:()=>`<p>Reviews on Embr are only from real bookings.</p><ul class="s mt12" style="padding-left:18px;line-height:1.9">

card or on 30 or 60-day terms through Embr\'s pay-later partner.\nc) The Talent is paid in full at sign-off, whatever terms the Client uses.\n\n5. Usage\n'+(b.usage.map(u=>'- '+u.media+', '+u.term+', '+u.territory+': '+(u.cond?'FINAL CUT ONLY, '+gbp(u.fee)+' if used':'guaranteed'+(u.fee?', '+gbp(u.fee):', included'))).join('\n')||'- None')+'\nAny other use needs a new agreement through Embr.\n\n5a. TV and outdoor records\nIf the Client uses the images on TV, it gives Embr the clock number of each ad within 14 days of first transmission. If it uses them outdoors, it gives Embr the media schedule within 14 days of the campaign starting and the proof-of-posting report when it ends. Embr may check these against the usage licence, and may ask to see the Client\'s media records for this booking. Use outside the licence is charged at a fee agreed on Embr for that use.\n\n5b. What the usage covers\nUsage includes edits, cutdowns, crops, different formats and stills taken from footage, all within the media, territory and period above. The period starts on the date the images are first used (first use: '+(b.firstUse?dYear(b.firstUse):'to be confirmed on Embr, and no later than '+dYear(addDays(183,b.date)))+'). Paid online media is limited to the territory; organic posts can be seen worldwide. After the period ends, organic posts already published may stay up, but nothing new may be posted, boosted or paid for. The Client may keep the images for internal records and awards entries without a time limit.\n\n5c. Renewals\n'+(b.usage.filter(u=>+u.renew>0).map(u=>u.media+': '+u.term+' more for '+gbp(u.renew)).join('\n')||'No renewal prices agreed. Any extension is agreed on Embr.')+'\nThe Client may renew at these prices through Embr. After each renewal, the price of the next one goes up by 10%.\n\n5d. AI\n'+(b.ai==='edit'?'The Client may use AI tools to edit or localise the Talent\'s performance in these materials (for example dubbing or versions for other markets). The Talent\'s image, voice and performance may not be used to train AI or to make new content.':'The Client may not use AI or digital tools to recreate, alter or clone the Talent\'s image, voice or performance, or use them to train AI. Normal editing and retouching is allowed.')+'\n\n6. Final cut\nFor usage marked final cut only, the Client confirms on Embr within '+b.cutDays+' days of the shoot whether each line is used. Used lines are charged plus the 10% fee and paid to the Talent. Lines not confirmed by the deadline are treated as used and charged. Lines confirmed as not used grant no rights; using them later is a breach and is charged at the agreed fee plus any remedy below.\n\n6a. Booking through Embr\nFor '+C().noncirc+' months from this booking, both parties agree to book and pay for further work together through Embr. To work together directly before then, the Client may pay Embr a one-off buy-out fee (amount to be set in Embr\'s terms). This does not limit work either party finds independently.\n\n6b. Fees for the day\nThe day is '+((b.x&&b.x.hours)||10)+' hours including an hour for lunch.'+(b.x&&b.x.ot?' Overtime is '+gbp(b.x.ot)+' for each hour or part of an hour past that, claimed by the Talent on Embr and approved by the Client at sign-off.':' No overtime rate was agreed; extra hours need the Talent\'s agreement.')+(b.x&&b.x.fit?' Fitting fee: '+gbp(b.x.fit)+'.':'')+'\nThe Talent is self-employed and responsible for their own tax.\n\n7. Exclusivity\n'+(b.excl==='None'?'None.':b.excl+(b.exclText?' ('+b.exclText+')':'')+(exclEnd(b)?', until '+dYear(exclEnd(b)):'')+'. The Talent won\'t appear in advertising for a directly competing brand in that category, in the territory, for this period. The Talent confirms they have no existing exclusivity that clashes with this booking.')+'\n\n8. Cancellation\n'+CANCEL[b.cancelH]+'. If the Client cancels later, the Talent receives 50% of the session fee from the deposit and the rest is refunded. If the Talent cancels, the Client is refunded in full.\n\n9. Problems\nEither party can report a problem on Embr before sign-off. Funds stay held until Embr\'s review ends.\n\n10. Conduct\nBoth parties follow Embr\'s community standards. The Talent may leave a set where they feel unsafe without penalty.\n\n10a. Appearance, confidentiality and posting\nThe Talent will not make big changes to their hair or appearance before the shoot without the Client\'s agreement. Both parties keep the Client\'s unreleased campaign confidential. The Talent may post about the job: '+(POST_OPTS[b.post||'launch']).toLowerCase()+'.'+(b.portfolio===false?'':' After launch, the Talent may use the final images in their own portfolio and showreel.')+'\n\n10b. Content\nContent agreed: '+((b.content||[]).length?b.content.join(', '):'no swimwear, underwear or nudity')+'. The Talent may refuse anything not listed here and may bring a chaperone.\n\n10c. Sign-off\nIf the Client does not sign off or report a problem within '+AUTO_H()+' hours of the Talent marking the job wrapped, the job is signed off automatically and the balance is charged.\n\n[Have a UK solicitor review this template before real use.]';}
